name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with the built-in csc (no SDK required)
        shell: pwsh
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw 'csc.exe not found' }
          & $csc /nologo /target:winexe /optimize+ /platform:anycpu /codepage:65001 `
            /win32icon:src\app.ico `
            /reference:System.dll /reference:System.Core.dll `
            /reference:System.Drawing.dll /reference:System.Windows.Forms.dll `
            /out:QuickStart.exe src\QuickStart.cs
          if ($LASTEXITCODE -ne 0) { throw "compile failed: $LASTEXITCODE" }
          $f = Get-Item QuickStart.exe
          Write-Host ("built QuickStart.exe: {0:N0} bytes" -f $f.Length)

      - uses: actions/upload-artifact@v4
        with:
          name: QuickStart-exe
          path: QuickStart.exe

      - name: Attach exe to the release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: QuickStart.exe
          generate_release_notes: true

      # Optional: keeps the repository description in sync.
      # GITHUB_TOKEN cannot edit repository metadata (needs Administration permission),
      # so this only runs when a PAT with `administration: write` is stored as REPO_PAT.
      # The text travels as base64 on purpose: PowerShell 5.1 decodes BOM-less UTF-8
      # scripts as ANSI, which mangles CJK.
      - name: Sync repository description
        if: ${{ secrets.REPO_PAT != '' }}
        continue-on-error: true
        shell: pwsh
        env:
          DESC_B64: QWx0K1NwYWNlIOaegeeugCBXaW5kb3dzIOW6lOeUqOWQr+WKqOWZqO+9nOWNleaWh+S7tiA3NktC77yM5peg56ys5LiJ5pa55L6d6LWW
        run: |
          $desc = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:DESC_B64))
          $body = @{ description = $desc } | ConvertTo-Json -Compress
          $path = Join-Path $env:RUNNER_TEMP 'desc.json'
          [System.IO.File]::WriteAllText($path, $body, (New-Object System.Text.UTF8Encoding($false)))

          $out = & curl.exe -s -w "`nHTTP:%{http_code}" -X PATCH `
            "https://api.github.com/repos/${{ github.repository }}" `
            -H "Authorization: Bearer ${{ secrets.REPO_PAT }}" `
            -H "Accept: application/vnd.github+json" `
            -H "User-Agent: ci" `
            -H "Content-Type: application/json" `
            --data-binary "@$path"
          Write-Host ($out -join "`n")